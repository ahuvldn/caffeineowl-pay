<style>
:root{--esp:#2b1a12;--esp2:#3d271c;--cream:#f8f1e6;--cream2:#efe3d0;--accent:#d9893b;--accent2:#b86a22;--ok:#3f7d4e;--ink:#2b1a12;--muted:#6f5a4b;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 32px}
header{background:var(--esp);color:var(--cream);padding:18px 18px 22px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px #d9893b}
.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;letter-spacing:.02em;font-weight:700}
.wordmark span{color:var(--accent)}
header p{margin:6px 0 0;color:#e2cdb4;font-size:.9rem}
.steps{display:flex;gap:6px;justify-content:center;margin:18px 0 6px;padding:0;list-style:none}
.steps li{width:34px;height:5px;border-radius:3px;background:var(--cream2)}
.steps li.on{background:var(--accent)}
h1{font-family:Georgia,serif;font-size:1.5rem;line-height:1.25;margin:14px 0 4px;outline:none}
.lead{color:var(--muted);margin:0 0 18px}
button,a.btn{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--cream2);border-radius:var(--r);padding:18px;margin:0 0 12px;color:var(--ink);font-size:1.15rem;font-weight:600;transition:border-color .15s,transform .15s}
.big:hover{border-color:var(--accent)}
.big:active{transform:scale(.99)}
.flag{font-size:1.9rem;line-height:1}
.big small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.link{background:none;border:0;color:var(--accent2);text-decoration:underline;padding:6px 2px;font-size:.95rem}
.tile{position:relative;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--cream2);border-radius:var(--r);padding:16px;margin:0 0 12px;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile.rec{border-color:var(--ok);box-shadow:0 4px 14px rgba(63,125,78,.12)}
.logo{width:56px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;letter-spacing:.01em}
.logo svg{width:26px;height:26px}
.t-name{font-weight:700;font-size:1.05rem}
.t-sub{font-size:.85rem;color:var(--muted)}
.fee{display:inline-block;margin-top:5px;font-size:.78rem;font-weight:600;color:var(--muted);background:var(--cream);border-radius:20px;padding:2px 9px}
.fee.zero{color:#fff;background:var(--ok)}
.save{display:block;font-size:.76rem;color:var(--accent2);margin-top:3px}
.badge{position:absolute;top:-11px;left:14px;background:var(--ok);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.02em}
.chev{color:var(--muted);font-size:1.4rem}
.note{font-size:.82rem;color:var(--muted);margin:6px 2px 0}
.card{background:#fff;border:2px solid var(--cream2);border-radius:var(--r);padding:6px 16px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--cream2)}
.row:last-child{border-bottom:0}
.row dt{font-size:.8rem;color:var(--muted)}
.row dd{margin:2px 0 0;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.copy{flex:none;background:var(--cream);border:1.5px solid var(--cream2);color:var(--esp);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:600;min-width:72px}
.copy:hover{border-color:var(--accent)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.ref{background:#fff6e8;border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:.92rem}
.btn{display:block;text-align:center;text-decoration:none;background:var(--esp);color:var(--cream);border:0;border-radius:var(--r);padding:16px;font-weight:700;font-size:1.05rem;margin:0 0 12px}
.btn:hover{background:var(--esp2)}
.btn.alt{background:var(--accent);color:var(--esp)}
.btn.alt:hover{background:#e49a50}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--esp);font-weight:600;padding:10px 4px;margin-top:8px}
.back:hover{color:var(--accent2)}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:6px 18px 24px}
footer a{color:var(--accent2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <p>How to pay your invoice</p>
</header>
<main class="wrap">
  <ol class="steps" aria-hidden="true"><li></li><li></li><li></li></ol>
  <p class="sr" id="live" aria-live="polite"></p>
  <div id="view"></div>
</main>
<footer id="foot"></footer>
<script>
(function(){
const C = CONFIG, $ = s => document.querySelector(s), view = $("#view");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = n => (Math.round(n*10)/10) + "%";
const LOGO = {
  bank: '<div class="logo" style="background:#e8f2ea;color:#3f7d4e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9l9-5 9 5z"/><path d="M5 10v7M9.5 10v7M14.5 10v7M19 10v7M3 20h18"/></svg></div>',
  wise: '<div class="logo" style="background:#9fe870;color:#163300">wise</div>',
  venmo: '<div class="logo" style="background:#008cff;color:#fff;font-style:italic;font-size:.85rem">venmo</div>',
  paypal: '<div class="logo" style="background:#eaf1fb;color:#123c85;font-style:italic">Pay<span style="color:#1f8ad6">Pal</span></div>'
};
const COUNTRY = {
  uk: {name:"United Kingdom", flag:"🇬🇧", methods:["bankUK","wise","paypal"]},
  us: {name:"United States", flag:"🇺🇸", methods:["bankUS","wise","venmo","paypal"]},
  other: {name:"elsewhere", flag:"🌍", methods:["wise","paypal"]}
};
const kind = k => k.startsWith("bank") ? "bank" : k;
let state = {country:null, method:null}, started = false;

function setStep(n, title){
  document.querySelectorAll(".steps li").forEach((li,i)=>li.classList.toggle("on", i < n));
  $("#live").textContent = "Step " + n + " of 3: " + title;
  const h = view.querySelector("h1"); if (h && started) h.focus({preventScroll:false});
  started = true;
  try { parent.postMessage({coPayHeight: document.body.scrollHeight}, "*"); } catch(e){}
}

function step1(){
  state = {country:null, method:null};
  view.innerHTML =
    '<h1 tabindex="-1">Where are you paying from?</h1>' +
    '<p class="lead">We\'ll show you the cheapest ways to pay from your country.</p>' +
    ['us','uk'].map(k => '<button class="big" data-c="'+k+'"><span class="flag" aria-hidden="true">'+COUNTRY[k].flag+'</span><span>'+COUNTRY[k].name+'<small>'+(k==="us"?"Pay in USD":"Pay in GBP")+'</small></span></button>').join("") +
    '<button class="link" data-c="other">Paying from somewhere else?</button>';
  view.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { state.country = b.dataset.c; step2(); });
  setStep(1, "Where are you paying from?");
}

function step2(){
  state.method = null;
  const co = COUNTRY[state.country];
  const list = co.methods.slice().sort((a,b) => C[a].fee - C[b].fee);
  const hasBank = list.some(k => kind(k) === "bank");
  const cheapest = C[list[0]].fee;
  view.innerHTML =
    '<h1 tabindex="-1">Choose how to pay</h1>' +
    '<p class="lead">' + (state.country==="other" ? "Paying from outside the UK and US." : "Paying from the " + co.name + ".") + ' Cheapest options first.</p>' +
    list.map(k => {
      const m = C[k], kd = kind(k), diff = m.fee - cheapest, rec = kd === "bank";
      return '<button class="tile'+(rec?' rec':'')+'" data-m="'+k+'">' +
        (rec ? '<span class="badge">Recommended · no fees</span>' : '') +
        LOGO[kd] +
        '<span><span class="t-name">'+esc(m.label||m.title)+'</span><span class="t-sub" style="display:block">'+esc(m.sub)+'</span>' +
        '<span class="fee'+(m.fee===0?' zero':'')+'">'+esc(m.feeLabel)+'</span>' +
        (m.tileNote ? '<span class="save" style="color:var(--muted)">'+esc(m.tileNote)+'</span>' : '') +
        (hasBank && diff >= 1 && m.showSave !== false ? '<span class="save">Save '+pct(diff)+' with bank transfer</span>' : '') +
        '</span><span class="chev" aria-hidden="true">›</span></button>';
    }).join("") +
    '<p class="note">PayPal prices include processing costs. Bank transfer and Wise keep more of your money in your pocket.</p>' +
    '<button class="back" data-back>‹ Change country</button>';
  view.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { state.method = b.dataset.m; step3(); });
  view.querySelector("[data-back]").onclick = step1;
  setStep(2, "Choose how to pay");
}

function row(label, value, copyVal){
  return '<div class="row"><dl style="margin:0"><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></dl>' +
    '<button class="copy" data-copy="'+esc(copyVal||value)+'" aria-label="Copy '+esc(label)+'">Copy</button></div>';
}
const refBox = '<div class="ref"><strong>Use '+esc(C.referenceHint)+' as the payment reference</strong> so I can match your payment.</div>';

function step3(){
  const k = state.method, m = C[k], kd = kind(k);
  let body = "";
  if (kd === "bank") {
    body = refBox + '<div class="card">' + m.fields.map(f => row(f[0], f[1])).join("") + '</div>' +
      '<p class="note">Send from your own bank app or online banking. There are no fees on my side.' + (m.note ? ' ' + esc(m.note) : '') + '</p>';
  } else if (kd === "wise") {
    body = refBox + '<div class="card">' + row("Wise tag", m.tag) + '</div>' +
      '<a class="btn alt" href="'+esc(m.link)+'" target="_blank" rel="noopener">Pay with Wise ↗</a>' +
      '<p class="note">Use the link, or search for my Wise tag in the Wise app. Wise shows its fee and exchange rate before you pay.</p>';
  } else if (kd === "venmo") {
    body = refBox + '<ol class="note" style="font-size:.92rem;color:var(--ink);padding-left:20px;margin:0 0 14px">' +
      '<li>Open Venmo and tap <strong>Pay</strong>.</li><li>Search for my phone number below. Venmo finds PayPal users by phone number.</li>' +
      '<li>Check it shows my PayPal account ('+esc(m.paypalName)+').</li><li>Put your invoice number in the note.</li></ol>' +
      '<div class="card">' + row("Phone number", m.phone, m.phoneCopy) + '</div>' +
      '<p class="note">'+esc(m.feeLabel)+'. Paying from your Venmo balance, bank or debit card avoids Venmo\'s credit card fee.</p>';
  } else {
    body = refBox + '<div class="card">' + row("PayPal email", m.email) + '</div>' +
      '<a class="btn alt" href="'+esc(m.link)+'" target="_blank" rel="noopener">Pay now with PayPal ↗</a>' +
      '<p class="note">This price includes about '+pct(m.fee)+' for processing. ' +
      (state.country !== "other" ? 'Save '+pct(m.fee)+' by paying with bank transfer instead.' : 'Wise is usually cheaper.') + '</p>';
  }
  view.innerHTML = '<div style="display:flex;align-items:center;gap:12px;margin-top:14px">' + LOGO[kd] +
    '<h1 tabindex="-1" style="margin:0">'+esc(m.label||m.title)+'</h1></div>' +
    '<p class="lead">'+esc(m.sub)+'</p>' + body +
    '<button class="back" data-back>‹ Back to payment options</button>';
  view.querySelector("[data-back]").onclick = step2;
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b));
  setStep(3, m.title);
}

function copy(b){
  const v = b.dataset.copy, ok = () => { b.textContent = "Copied ✓"; b.classList.add("done"); $("#live").textContent = "Copied"; setTimeout(()=>{ b.textContent="Copy"; b.classList.remove("done"); }, 1800); };
  const fallback = () => { const t = document.createElement("textarea"); t.value = v; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); ok(); }catch(e){ b.textContent="Select & copy"; } t.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(ok, fallback); else fallback();
}

$("#home").onclick = e => { e.preventDefault(); step1(); };
$("#foot").innerHTML = 'Questions? <a href="mailto:'+esc(C.contactEmail)+'">'+esc(C.contactEmail)+'</a> · <a href="https://'+esc(C.site)+'" target="_blank" rel="noopener">'+esc(C.site)+'</a>';
step1();
})();
</script>
</body>
</html>
